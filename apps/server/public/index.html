<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgeKeys • Devnet Demo</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0b0f19;color:#eef;line-height:1.5;margin:0;padding:24px;}
    .wrap{max-width:900px;margin:0 auto;}
    h1{font-size:28px;margin:0 0 8px}
    .card{background:#111729;border:1px solid #2a3452;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,0.25)}
    label{display:block;font-size:14px;color:#a9b8e8;margin:8px 0 4px}
    input,select,button{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #3a466e;background:#0f1526;color:#e8eeff}
    button{cursor:pointer;background:#2b7bfa;border-color:#2b7bfa;color:white}
    button.secondary{background:#203055;border-color:#384b7a}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .qr{background:white;border-radius:12px;padding:12px;display:inline-block;margin-top:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#b6c4ff}
    a {color:#8ec1ff}
    .pill{display:inline-block;background:#1b2640;border:1px solid #344a79;color:#d0ddff;padding:4px 8px;border-radius:999px;font-size:12px;margin-right:6px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>EdgeKeys <span class="pill">Devnet</span> <span class="pill">QR → Pay → Token → Infer</span></h1>

  <div class="card">
    <h2>1) Generate Checkout</h2>
    <div class="row">
      <div>
        <label>Asset</label>
        <select id="asset">
          <option value="SOL">SOL</option>
          <option value="SPL">USDC (SPL)</option>
        </select>
      </div>
      <div>
        <label>Amount</label>
        <input id="amount" type="number" step="0.000001" value="0.01"/>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="btnGen">Generate QR</button>
      </div>
    </div>
    <div id="genOut" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>2) Poll Payment</h2>
    <div class="row">
      <button id="btnPoll" class="secondary">Check Status</button>
      <div id="status" class="mono"></div>
    </div>
  </div>

  <div class="card">
    <h2>3) Issue Token</h2>
    <div class="row">
      <div style="flex:1 1 340px">
        <label>Your Wallet Public Key</label>
        <input id="pubkey" type="text" placeholder="Enter your devnet wallet pubkey"/>
      </div>
      <button id="btnIssue">Issue JWT</button>
    </div>
    <div id="tokenOut" class="mono" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>4) Infer (Stub)</h2>
    <div class="row">
      <div style="flex:1 1 340px">
        <label>Prompt</label>
        <input id="prompt" type="text" value="Hello EdgeKeys"/>
      </div>
      <button id="btnInfer">Call /v1/infer</button>
    </div>
    <div id="inferOut" class="mono" style="margin-top:10px"></div>
  </div>
</div>

<script>
let reference = null;
let lastUrl = null;
let jwtToken = null;

function el(id){ return document.getElementById(id); }

el('btnGen').onclick = async () => {
  const asset = el('asset').value;
  const rawAmt = (el('amount').value || '').trim().replace(',', '.');
  const amount = parseFloat(rawAmt || '0');

  const r = await fetch('/api/checkout', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({ asset, amount })
  }).then(r=>r.json());

  if(!r.ok){ el('genOut').innerHTML = '<div class="mono">Error: '+(r.error||'unknown')+'</div>'; return; }

  reference = r.reference;
  lastUrl = r.url;

  const svgDataUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
el('genOut').innerHTML = `
  <div>Reference: <span class="mono">${reference}</span></div>
  <div style="margin-top:8px"><a href="${lastUrl}">Open in wallet</a></div>
  <div class="qr" id="qrBox"><img src="${svgDataUrl}" alt="QR" style="display:block;width:240px;height:240px"></div>
  <div class="mono" style="margin-top:8px;word-break:break-all">URL: ${lastUrl}</div>
`;

};

el('btnPoll').onclick = async () => {
  if(!reference){ el('status').innerText = 'No reference yet — generate a QR first.'; return; }
  const r = await fetch('/api/status?reference=' + encodeURIComponent(reference)).then(r=>r.json());
  el('status').innerText = JSON.stringify(r, null, 2);
};

el('btnIssue').onclick = async () => {
  if(!reference){ alert('Generate a QR first.'); return; }
  const userPubkey = el('pubkey').value.trim();
  if(!userPubkey){ alert('Enter your wallet public key.'); return; }
  const r = await fetch('/api/issue', {
    method:'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({ reference, userPubkey })
  }).then(r=>r.json());
  jwtToken = r.token;
  el('tokenOut').innerText = JSON.stringify(r, null, 2);
};

el('btnInfer').onclick = async () => {
  if(!jwtToken){ alert('Issue a token first.'); return; }
  const prompt = el('prompt').value;
  const r = await fetch('/v1/infer', {
    method:'POST',
    headers: {'content-type':'application/json', 'authorization':'Bearer ' + jwtToken },
    body: JSON.stringify({ prompt })
  }).then(r=>r.json());
  el('inferOut').innerText = JSON.stringify(r, null, 2);
};
</script>
</body>
</html>
